<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تسجيل الدخول — TD Academy</title>
<meta name="description" content="سجّل دخولك إلى لوحة المتدرب في TD Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<style>
  .input-error {
    border-color: #DC2626 !important;
    background: rgba(220,38,38,0.05) !important;
  }
  .error-msg {
    color: #DC2626;
    font-size: 0.85rem;
    margin-top: 8px;
    text-align: center;
    display: none;
  }
  .error-msg.show {
    display: block;
  }
  .forgot-link {
    text-align: left;
    margin-top: -4px;
    margin-bottom: 8px;
  }
  .forgot-link a {
    color: var(--accent, #10B981);
    font-size: 0.85rem;
    text-decoration: none;
    cursor: pointer;
  }
  .forgot-link a:hover {
    text-decoration: underline;
  }
  #recovery-form h2,
  #recovery-reset-form h2 {
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-logo">
      <img src="../../logo-td.png" alt="TD Academy">
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <h2>مرحباً بعودتك</h2>
      <p class="auth-sub">سجّل دخولك للوصول إلى لوحتك الشخصية</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="login-email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <p class="error-msg" id="login-error"></p>
        <button type="submit" class="btn btn-green btn-lg" style="width:100%;justify-content:center;margin-top:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          تسجيل الدخول
        </button>
        <div class="forgot-link" style="text-align:center;margin-top:12px;margin-bottom:0">
          <a href="#" onclick="showRecovery()">نسيت كلمة المرور؟</a>
        </div>
      </form>
      <p class="auth-toggle">ليس لديك حساب؟ <a href="#" onclick="showRegister()">إنشاء حساب جديد</a></p>
    </div>

    <!-- RECOVERY FORM - Step 1: Enter Email -->
    <div id="recovery-form" style="display:none">
      <h2>استعادة كلمة المرور</h2>
      <p class="auth-sub">أدخل بريدك الإلكتروني المسجّل</p>
      <form onsubmit="handleRecoveryEmail(event)">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="recovery-email" placeholder="example@email.com" required>
        </div>
        <p class="error-msg" id="recovery-error"></p>
        <button type="submit" class="btn btn-green btn-lg" style="width:100%;justify-content:center;margin-top:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          التحقق من البريد
        </button>
      </form>
      <p class="auth-toggle"><a href="#" onclick="showLogin()">العودة لتسجيل الدخول</a></p>
    </div>

    <!-- RECOVERY FORM - Step 2: Set New Password -->
    <div id="recovery-reset-form" style="display:none">
      <h2>تعيين كلمة مرور جديدة</h2>
      <p class="auth-sub" id="recovery-user-info"></p>
      <form onsubmit="handlePasswordReset(event)">
        <div class="form-group">
          <label>كلمة المرور الجديدة</label>
          <input type="password" id="new-password" placeholder="8 أحرف على الأقل" minlength="8" required>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="new-password-confirm" placeholder="أعد كتابة كلمة المرور" required>
        </div>
        <p class="error-msg" id="reset-error"></p>
        <button type="submit" class="btn btn-green btn-lg" style="width:100%;justify-content:center;margin-top:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          حفظ كلمة المرور الجديدة
        </button>
      </form>
      <p class="auth-toggle"><a href="#" onclick="showLogin()">العودة لتسجيل الدخول</a></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <h2>إنشاء حساب جديد</h2>
      <p class="auth-sub">انضم إلى مجتمع TD Academy</p>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="reg-name" placeholder="أدخل اسمك الكامل" required>
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="reg-email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="reg-password" placeholder="8 أحرف على الأقل" minlength="8" required>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="reg-confirm" placeholder="أعد كتابة كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-green btn-lg" style="width:100%;justify-content:center;margin-top:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          إنشاء الحساب
        </button>
      </form>
      <p class="auth-toggle">لديك حساب بالفعل؟ <a href="#" onclick="showLogin()">تسجيل الدخول</a></p>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// --- Navigation between forms ---
function showLogin(){
  document.getElementById('login-form').style.display='block';
  document.getElementById('register-form').style.display='none';
  document.getElementById('recovery-form').style.display='none';
  document.getElementById('recovery-reset-form').style.display='none';
  clearErrors();
}
function showRegister(){
  document.getElementById('login-form').style.display='none';
  document.getElementById('register-form').style.display='block';
  document.getElementById('recovery-form').style.display='none';
  document.getElementById('recovery-reset-form').style.display='none';
  clearErrors();
}
function showRecovery(){
  document.getElementById('login-form').style.display='none';
  document.getElementById('register-form').style.display='none';
  document.getElementById('recovery-form').style.display='block';
  document.getElementById('recovery-reset-form').style.display='none';
  clearErrors();
}

// --- Error helpers ---
function clearErrors(){
  document.querySelectorAll('.input-error').forEach(el=>el.classList.remove('input-error'));
  document.querySelectorAll('.error-msg').forEach(el=>{el.classList.remove('show');el.textContent='';});
}

function showFieldError(inputIds, errorElId, message){
  inputIds.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.add('input-error');
  });
  const errEl=document.getElementById(errorElId);
  if(errEl){errEl.textContent=message;errEl.classList.add('show');}
}

// Remove red state on typing
document.addEventListener('input',function(e){
  if(e.target.tagName==='INPUT'){
    e.target.classList.remove('input-error');
    // hide associated error message
    const form=e.target.closest('[id]');
    if(form){
      const errMsg=form.querySelector('.error-msg');
      if(errMsg){errMsg.classList.remove('show');errMsg.textContent='';}
    }
  }
});

// --- Toast ---
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3000);
}

// --- Login ---
function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;

  const users=JSON.parse(localStorage.getItem('td_users')||'[]');
  const user=users.find(u=>u.email===email&&u.password===pass);

  if(user){
    localStorage.setItem('td_current_user',JSON.stringify(user));
    showToast('تم تسجيل الدخول بنجاح!','success');
    setTimeout(()=>window.location.href='index.html',800);
  } else {
    showFieldError(['login-email','login-password'],'login-error','البريد الإلكتروني أو كلمة المرور غير صحيحة');
    showToast('البريد أو كلمة المرور غير صحيحة','error');
  }
}

// --- Recovery Step 1: Verify Email ---
let recoveryTargetEmail='';

function handleRecoveryEmail(e){
  e.preventDefault();
  const email=document.getElementById('recovery-email').value.trim();
  const users=JSON.parse(localStorage.getItem('td_users')||'[]');
  const user=users.find(u=>u.email===email);

  if(!user){
    showFieldError(['recovery-email'],'recovery-error','لا يوجد حساب مسجّل بهذا البريد الإلكتروني');
    return;
  }

  // Email found - show reset form
  recoveryTargetEmail=email;
  document.getElementById('recovery-user-info').textContent='تعيين كلمة مرور جديدة للحساب: '+email;
  document.getElementById('recovery-form').style.display='none';
  document.getElementById('recovery-reset-form').style.display='block';
}

// --- Recovery Step 2: Set New Password ---
function handlePasswordReset(e){
  e.preventDefault();
  const newPass=document.getElementById('new-password').value;
  const confirmPass=document.getElementById('new-password-confirm').value;

  if(newPass!==confirmPass){
    showFieldError(['new-password','new-password-confirm'],'reset-error','كلمتا المرور غير متطابقتين');
    return;
  }

  let users=JSON.parse(localStorage.getItem('td_users')||'[]');
  const idx=users.findIndex(u=>u.email===recoveryTargetEmail);

  if(idx===-1){
    showFieldError([],'reset-error','حدث خطأ، يرجى المحاولة مرة أخرى');
    return;
  }

  users[idx].password=newPass;
  localStorage.setItem('td_users',JSON.stringify(users));

  showToast('تم تغيير كلمة المرور بنجاح! سجّل دخولك الآن','success');
  setTimeout(()=>showLogin(),1000);
}

// --- Register ---
function handleRegister(e){
  e.preventDefault();
  const name=document.getElementById('reg-name').value;
  const email=document.getElementById('reg-email').value;
  const pass=document.getElementById('reg-password').value;
  const confirm=document.getElementById('reg-confirm').value;

  if(pass!==confirm){
    showToast('كلمتا المرور غير متطابقتين','error');
    return;
  }

  let users=JSON.parse(localStorage.getItem('td_users')||'[]');

  if(users.find(u=>u.email===email)){
    showToast('هذا البريد مسجّل مسبقاً','error');
    return;
  }

  const newUser={
    id: Date.now().toString(),
    name,
    email,
    password: pass,
    role: 'free',
    avatar: '',
    joinDate: new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}),
    bio: ''
  };

  users.push(newUser);
  localStorage.setItem('td_users',JSON.stringify(users));
  localStorage.setItem('td_current_user',JSON.stringify(newUser));

  showToast('تم إنشاء الحساب بنجاح!','success');
  setTimeout(()=>window.location.href='index.html',800);
}

// seed super admin if no users exist
(function(){
  let users=JSON.parse(localStorage.getItem('td_users')||'[]');
  if(users.length===0){
    users.push({
      id:'1',
      name:'د. حسين طاحون',
      email:'admin@tdacademy.net',
      password:'admin123',
      role:'super_admin',
      avatar:'../../dr-hussein.jpg',
      joinDate:'1 يناير 2026',
      bio:'مؤسس TD Academy — جرّاح ومتداول'
    });
    localStorage.setItem('td_users',JSON.stringify(users));
  }
})();

// redirect if already logged in
(function(){
  const u=localStorage.getItem('td_current_user');
  if(u) window.location.href='index.html';
})();
</script>

</body>
</html>
