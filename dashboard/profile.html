<!-- MAIN -->
<main class="main">

  <!-- Profile header -->
  <div class="profile-header" id="profile-header">
    <div class="profile-avatar-wrap">
      <img class="profile-avatar" id="profile-avatar" src="" alt="">
      <label class="profile-avatar-edit" for="avatar-upload">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </label>
      <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
    </div>
    <div class="profile-info">
      <h2 id="profile-name"></h2>
      <span class="role-badge" id="profile-role-badge"></span>
      <p class="profile-meta" id="profile-meta"></p>
    </div>
  </div>

  <!-- Edit form -->
  <div class="dash-card">
    <div class="dash-card-header">
      <h3 class="dash-card-title">تعديل المعلومات الشخصية</h3>
    </div>
    <form onsubmit="saveProfile(event)">
      <div class="profile-form">
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" id="edit-name" required>
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="edit-email" required>
        </div>
        <div class="form-group full-width">
          <label>نبذة شخصية</label>
          <textarea id="edit-bio" placeholder="اكتب نبذة قصيرة عنك..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-green btn-md">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          حفظ التغييرات
        </button>
      </div>
    </form>
  </div>

  <!-- Change password -->
  <div class="dash-card" style="margin-top:20px">
    <div class="dash-card-header">
      <h3 class="dash-card-title">تغيير كلمة المرور</h3>
    </div>
    <form onsubmit="changePassword(event)">
      <div class="profile-form">
        <div class="form-group">
          <label>كلمة المرور الحالية</label>
          <input type="password" id="old-pass" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور الجديدة</label>
          <input type="password" id="new-pass" minlength="8" required>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="confirm-pass" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-outline btn-md">تغيير كلمة المرور</button>
      </div>
    </form>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
function initProfile(){
  const user = requireAuth();
  if(!user) return;
  const u = refreshUser(user);
  initSidebar(u);

  document.getElementById('profile-name').textContent = u.name;
  document.getElementById('profile-avatar').src = avatarSrc(u);
  const badge = document.getElementById('profile-role-badge');
  badge.textContent = ROLES_AR[u.role];
  badge.className = 'role-badge ' + (u.role==='super_admin'?'super-admin':u.role==='admin'?'admin':u.role==='subscriber'?'subscriber':'free');
  document.getElementById('profile-meta').textContent = 'انضم في ' + u.joinDate + ' • ' + u.email;

  document.getElementById('edit-name').value = u.name;
  document.getElementById('edit-email').value = u.email;
  document.getElementById('edit-bio').value = u.bio || '';
}

function saveProfile(e){
  e.preventDefault();
  let user = JSON.parse(localStorage.getItem('td_current_user'));
  let users = getUsers();
  const idx = users.findIndex(u=>u.id===user.id);
  if(idx===-1) return;

  const newEmail = document.getElementById('edit-email').value;
  if(newEmail !== user.email && users.find(u=>u.email===newEmail)){
    showToast('هذا البريد مسجّل مسبقاً','error');
    return;
  }

  users[idx].name = document.getElementById('edit-name').value;
  users[idx].email = newEmail;
  users[idx].bio = document.getElementById('edit-bio').value;
  saveUsers(users);
  localStorage.setItem('td_current_user',JSON.stringify(users[idx]));
  showToast('تم حفظ التغييرات بنجاح','success');
  initProfile();
}

function changePassword(e){
  e.preventDefault();
  let user = JSON.parse(localStorage.getItem('td_current_user'));
  let users = getUsers();
  const idx = users.findIndex(u=>u.id===user.id);

  if(document.getElementById('old-pass').value !== users[idx].password){
    showToast('كلمة المرور الحالية غير صحيحة','error');
    return;
  }
  if(document.getElementById('new-pass').value !== document.getElementById('confirm-pass').value){
    showToast('كلمتا المرور الجديدتين غير متطابقتين','error');
    return;
  }

  users[idx].password = document.getElementById('new-pass').value;
  saveUsers(users);
  localStorage.setItem('td_current_user',JSON.stringify(users[idx]));
  showToast('تم تغيير كلمة المرور بنجاح','success');
  e.target.reset();
}

function handleAvatarUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let user = JSON.parse(localStorage.getItem('td_current_user'));
    let users = getUsers();
    const idx = users.findIndex(u=>u.id===user.id);
    users[idx].avatar = e.target.result;
    saveUsers(users);
    localStorage.setItem('td_current_user',JSON.stringify(users[idx]));
    showToast('تم تحديث الصورة الشخصية','success');
    initProfile();
  };
  reader.readAsDataURL(file);
}

initProfile();
initNotifBell();
document.addEventListener('click',function(e){
  var bell=document.getElementById('notif-bell');var dd=document.getElementById('notif-dropdown');
  if(bell&&dd&&!bell.contains(e.target)&&!dd.contains(e.target))dd.classList.remove('show');
});
</script>

</body>
