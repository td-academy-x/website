             placeholder="you@example.com" required autocomplete="email" dir="ltr" style="text-align:left">

    <div class="auth-field">
      <label for="phone_number">رقم الهاتف / واتساب</label>

quot;,&quot;dial&quot;:&quot;+252&quot;,&quot;ar&quot;:&quot;الصومال&quot;},{&quot;iso&quot;:&quot;DJ&quot;,&quot;dial&quot;:&quot;+253&quot;,&quot;ar&quot;:&quot;جيبوتي&quot;},{&quot;iso&quot;:&quot;KM&quot;,&quot;dial&quot;:&quot;+269&quot;,&quot;ar&quot;:&quot;جزر القمر&quot;},{&quot;iso&quot;:&quot;TR&quot;,&quot;dial&quot;:&quot;+90&quot;,&quot;ar&quot;:&quot;تركيا&quot;},{&quot;iso&quot;:&quot;IR&quot;,&quot;dial&quot;:&quot;+98&quot;,&quot;ar&quot;:&quot;إيران&quot;},{&quot;iso&quot;:&quot;PK&quot;,&quot;dial&quot;:&quot;+92&quot;,&quot;ar&quot;:&quot;باكستان&quot;},{&quot;iso&quot;:&quot;IN&quot;,&quot;dial&quot;:&quot;+91&quot;,&quot;ar&quot;:&quot;الهند&quot;},{&quot;iso&quot;:&quot;ID&quot;,&quot;dial&quot;:&quot;+62&quot;,&quot;ar&quot;:&quot;إندونيسيا&quot;},{&quot;iso&quot;:&quot;MY&quot;,&quot;dial&quot;:&quot;+60&quot;,&quot;ar&quot;:&quot;ماليزيا&quot;},{&quot;iso&quot;:&quot;US&quot;,&quot;dial&quot;:&quot;+1&quot;,&quot;ar&quot;:&quot;الولايات المتحدة&quot;},{&quot;iso&quot;:&quot;CA&quot;,&quot;dial&quot;:&quot;+1&quot;,&quot;ar&quot;:&quot;كندا&quot;},{&quot;iso&quot;:&quot;GB&quot;,&quot;dial&quot;:&quot;+44&quot;,&quot;ar&quot;:&quot;المملكة المتحدة&quot;},{&quot;iso&quot;:&quot;FR&quot;,&quot;dial&quot;:&quot;+33&quot;,&quot;ar&quot;:&quot;فرنسا&quot;},{&quot;iso&quot;:&quot;DE&quot;,&quot;dial&quot;:&quot;+49&quot;,&quot;ar&quot;:&quot;ألمانيا&quot;},{&quot;iso&quot;:&quot;IT&quot;,&quot;dial&quot;:&quot;+39&quot;,&quot;ar&quot;:&quot;إيطاليا&quot;},{&quot;iso&quot;:&quot;ES&quot;,&quot;dial&quot;:&quot;+34&quot;,&quot;ar&quot;:&quot;إسبانيا&quot;},{&quot;iso&quot;:&quot;NL&quot;,&quot;dial&quot;:&quot;+31&quot;,&quot;ar&quot;:&quot;هولندا&quot;},{&quot;iso&quot;:&quot;SE&quot;,&quot;dial&quot;:&quot;+46&quot;,&quot;ar&quot;:&quot;السويد&quot;},{&quot;iso&quot;:&quot;CH&quot;,&quot;dial&quot;:&quot;+41&quot;,&quot;ar&quot;:&quot;سويسرا&quot;},{&quot;iso&quot;:&quot;AU&quot;,&quot;dial&quot;:&quot;+61&quot;,&quot;ar&quot;:&quot;أستراليا&quot;},{&quot;iso&quot;:&quot;NG&quot;,&quot;dial&quot;:&quot;+234&quot;,&quot;ar&quot;:&quot;نيجيريا&quot;},{&quot;iso&quot;:&quot;ZA&quot;,&quot;dial&quot;:&quot;+27&quot;,&quot;ar&quot;:&quot;جنوب أفريقيا&quot;},{&quot;iso&quot;:&quot;BR&quot;,&quot;dial&quot;:&quot;+55&quot;,&quot;ar&quot;:&quot;البرازيل&quot;},{&quot;iso&quot;:&quot;CN&quot;,&quot;dial&quot;:&quot;+86&quot;,&quot;ar&quot;:&quot;الصين&quot;},{&quot;iso&quot;:&quot;JP&quot;,&quot;dial&quot;:&quot;+81&quot;,&quot;ar&quot;:&quot;اليابان&quot;},{&quot;iso&quot;:&quot;KR&quot;,&quot;dial&quot;:&quot;+82&quot;,&quot;ar&quot;:&quot;كوريا الجنوبية&quot;},{&quot;iso&quot;:&quot;RU&quot;,&quot;dial&quot;:&quot;+7&quot;,&quot;ar&quot;:&quot;روسيا&quot;}]'), 'AE|+971')"
     @keydown.escape.window="open = false">
  <input type="hidden" name="dial_country" :value="selected ? selected.iso + '|' + selected.dial : ''">

  <button type="button" class="auth-input cc-btn" @click="toggle()" :aria-expanded="open" aria-haspopup="listbox">
    <span class="cc-flag" x-text="selected?.flag"></span>
    <span class="cc-dial" x-text="selected?.dial"></span>
    <svg class="cc-caret" :class="{ 'is-open': open }" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <div class="cc-panel" x-show="open" x-cloak @click.outside="open = false"
       x-transition:enter="cc-enter" x-transition:enter-start="cc-enter-start" x-transition:enter-end="cc-enter-end"
       x-transition:leave="cc-leave" x-transition:leave-start="cc-leave-start" x-transition:leave-end="cc-leave-end">
    <div class="cc-search-wrap">
      <svg class="cc-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="cc-search" x-model="q" x-ref="search"
             placeholder="ابحث عن الدولة أو الرمز…" @keydown.enter.prevent="pickFirst()">
    </div>
    <ul class="cc-list" role="listbox">
      <template x-for="c in filtered" :key="c.iso">
        <li class="cc-opt" role="option" :class="{ 'is-sel': selected && c.iso === selected.iso }" @click="pick(c)">
          <span class="cc-flag" x-text="c.flag"></span>
          <span class="cc-name" x-text="c.ar"></span>
          <span class="cc-dial" x-text="c.dial"></span>
        </li>
      </template>
      <li class="cc-empty" x-show="filtered.length === 0">لا توجد نتائج</li>
    </ul>
  </div>
</div>

<script>
  if (!window.countrySelect) {
    window.countrySelect = function (countries, oldVal) {
      const flagOf = (iso) => iso.toUpperCase().replace(/./g, (c) =>
        String.fromCodePoint(127397 + c.charCodeAt(0)));
      const list = countries.map((c) => ({ ...c, flag: flagOf(c.iso) }));
      const iso = String(oldVal || 'AE|+971').split('|')[0];

      return {
        open: false,
        q: '',
        countries: list,
        selected: list.find((c) => c.iso === iso) || list[0],
        get filtered() {
          const raw = this.q.trim();
          if (!raw) return this.countries;
          const q = raw.toLowerCase();
          return this.countries.filter((c) =>
            c.ar.includes(raw) || c.dial.includes(q) || c.iso.toLowerCase().includes(q));
        },
        toggle() {
          this.open = !this.open;
          if (this.open) {
            this.q = '';
            this.$nextTick(() => this.$refs.search && this.$refs.search.focus());
          }
        },
        pick(c) { this.selected = c; this.open = false; },
        pickFirst() { if (this.filtered.length) this.pick(this.filtered[0]); },
      };
    };
  }
</script>
        <input id="phone_number" name="phone_number" type="tel" value=""
               class="auth-input auth-num  "
               placeholder="50 123 4567" required inputmode="tel" autocomplete="tel-national">
      </div>
                </div>

    <div class="auth-field">
      <label for="password">كلمة المرور</label>
      <div class="auth-pass">

               placeholder="٨ أحرف على الأقل" required autocomplete="new-password">

                :aria-label="showPass ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">
          <svg x-show="!showPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg x-show="showPass" x-cloak viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
          </div>

    <div class="auth-field">
      <label for="password_confirmation">تأكيد كلمة المرور</label>

    </div>


    <label class="auth-check">

      <span>أوافق على <a href="https://tdacademy.net/privacy-policy" target="_blank">سياسة الخصوصية</a>
            و<a href="https://tdacademy.net/terms" target="_blank">الشروط والأحكام</a></span>
    </label>


    <label class="auth-check">
      <input type="checkbox" name="marketing_consent" value="1" >
      <span>أرغب في تلقّي التحديثات والعروض عبر البريد الإلكتروني أو واتساب</span>
    </label>

    <button type="submit" class="auth-btn" :disabled="!agreePrivacy">اشترك الآن</button>
  </form>

  <div class="auth-links">
    لديك حساب بالفعل؟ <a href="https://tdacademy.net/login">تسجيل الدخول</a>

    </div>

    <p class="auth-foot">
      &copy; 2026 TD Academy — أكاديمية تداول الأسهم الأمريكية
    </p>
  </main>

</body>
